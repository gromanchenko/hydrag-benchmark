[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydrag-benchmark"
version = "0.9.0"
description = "Local-only RAG benchmarking CLI — measures recall, MRR, chunk overlap, latency, and BEIR IR metrics"
dynamic = ["readme"]
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Studio Playbook Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["rag", "benchmark", "retrieval", "hydrag", "recall", "mrr"]
dependencies = [
    "hydrag-core[chromadb]>=1.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "transformers>=4.45",
]
metrics = [
    "psutil>=5.9",
    "nvidia-ml-py>=11.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
hydrag-bench = "hydrag_benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/gromanchenko/hydrag-benchmark"
Documentation = "https://github.com/gromanchenko/hydrag-benchmark#readme"
Repository = "https://github.com/gromanchenko/hydrag-benchmark"
Changelog = "https://github.com/gromanchenko/hydrag-benchmark/blob/main/CHANGELOG.md"
Issues = "https://github.com/gromanchenko/hydrag-benchmark/issues"

[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/hydrag_benchmark"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "suites/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Optional extras (gpu, metrics) and undeclared-but-used optional deps
# (boto3, PyYAML): may or may not be installed depending on which
# extras are active. ignore_missing_imports suppresses both
# "import-not-found" (absent) and "import-untyped" (present, untyped)
# consistently instead of scattered inline `# type: ignore` comments
# whose "unused" status flips with the installed extras (T-5057
# mirrors this for hydrag-core; T-5061 applies it here).
module = [
    "torch",
    "transformers",
    "boto3",
    "yaml",
    "pynvml",
    "psutil",
]
ignore_missing_imports = true
